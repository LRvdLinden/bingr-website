name: Website

# Zet de site via FTPS op de webserver (bingr.online), bij elke push naar main, met de hand, of na de Covers-workflow.
# Benodigde repository-secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optioneel: FTP_USERNAME_ALT (tweede gebruikersnaam om te proberen) en FTP_DIR (doelmap, anders automatisch).
# Alleen FTPS met een geverifieerd certificaat. FTP_SERVER moet een naam uit het certificaat zijn (bij gedeelde hosting vaak
# die van de hoster); anders zoekt de workflow een naam uit het certificaat met hetzelfde IP-adres, of stopt met een foutmelding.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: website-deploy
  cancel-in-progress: false


# security M5: alleen lezen (deze workflow pusht niets en gebruikt GITHUB_TOKEN alleen voor de checkout)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          ref: main

      # build 146: pincode als hash (web/js/pin.js) tegen de testvectoren van het contract; faalt = niet uploaden
      - name: Unittests webspeler
        # build 147: na "klaar" geen lange taken (catalogus van 10k films, gids, pincode in stukjes)
        # build 148: 37k films, 12k zenders, 9k series; --expose-gc voor eerlijke geheugencijfers
        # build 149: snelle ISO-parser, gedeelde datumopmakers, JSON in een Worker en Ontdek categorieën; grote server
        # (123k films, 30k series, 12k zenders, 80% verborgen): piekgeheugen < 500 MB en geen lange stap
        # build 151: sync toepassen en bewaren in stappen/Worker (groot profiel, zelfde uitkomst als ≤ 150); rij Zenders (format_test)
        run: |
          node tools/test/pin_test.js
          node tools/test/format_test.js
          node --expose-gc tools/test/longtask_test.js
          node --expose-gc tools/test/bigserver_test.js
          node --expose-gc tools/test/sync_test.js

      - name: lftp en Pillow installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp python3-pil

      # De homepage laadt de screenshots als WebP (<picture> met JPG als terugval). tools/sync_website.py in
      # iptv-ios-appletv schrijft alleen de JPG's; hier worden de WebP's opnieuw gemaakt, zodat ze altijd overeenkomen.
      - name: WebP van de screenshots maken
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image
          n = 0
          for f in sorted(glob.glob("assets/img/nl/*.jpg") + glob.glob("assets/img/en/*.jpg")):
              Image.open(f).save(f[:-4] + ".webp", "WEBP", quality=80, method=6)
              n += 1
          assert n, "geen screenshots gevonden"
          print(f"{n} WebP-bestanden gemaakt")
          PY

      - name: Uploaden via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::warning::FTP-secrets ontbreken (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) — website niet geüpload."
            exit 0
          fi
          # spaties/regeleinden rond de secrets weghalen; wachtwoord via LFTP_PASSWORD (tekens als , " ; # breken anders lftp)
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_SERVER=$(trim "${FTP_SERVER:-}" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##'); FTP_USERNAME=$(trim "${FTP_USERNAME:-}"); FTP_USERNAME_ALT=$(trim "${FTP_USERNAME_ALT:-}"); FTP_PASSWORD=$(trim "$FTP_PASSWORD")
          export LFTP_PASSWORD="$FTP_PASSWORD"
          # alleen versleuteld (FTPS) met een geldig certificaat; geen terugval op gewone FTP of andere servers
          common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set ftp:passive-mode true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:check-hostname yes; set ssl:ca-file /tmp/ftp-ca.pem"
          ip_of(){ (getent ahostsv4 "$1" || true) | awk 'NR==1{print $1}'; }
          # certificaat geldig voor deze hostnaam? (controle vóór er inloggegevens worden verstuurd)
          # build 95: sommige FTP-servers sturen het tussencertificaat niet mee (onvolledige keten). Dat halen we op via
          # het AIA-adres in het certificaat zelf en zetten het naast de standaard root-certificaten; de controle tegen
          # een vertrouwde root blijft dus volledig.
          CA=/tmp/ftp-ca.pem; cp /etc/ssl/certs/ca-certificates.crt "$CA"
          add_chain(){
            local h="$1" aia
            aia=$(timeout 30 openssl s_client -connect "$h:21" -starttls ftp -servername "$h" </dev/null 2>/dev/null \
              | openssl x509 -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1 || true)
            [ -n "$aia" ] || return 0
            curl -fsSL --max-time 20 "$aia" -o /tmp/inter.bin 2>/dev/null || return 0
            openssl x509 -inform DER -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || openssl x509 -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || return 0
            grep -q "$(sed -n 2p /tmp/inter.pem)" "$CA" || cat /tmp/inter.pem >> "$CA"
          }
          vcode(){ timeout 40 openssl s_client -connect "$1:21" -starttls ftp -servername "$1" -verify_hostname "$1" -CAfile "$CA" </dev/null 2>/dev/null | grep -m1 'Verify return code' | sed 's/.*Verify return code: //' || true; }
          cert_ok(){ timeout 40 openssl s_client -connect "$1:21" -starttls ftp -servername "$1" -verify_hostname "$1" -verify_return_error -CAfile "$CA" </dev/null 2>/dev/null | grep -q 'Verify return code: 0 (ok)'; }
          # Welke host? FTP_SERVER, anders ftp.bingr.online, anders bingr.online (zoals vroeger), maar alleen als het
          # certificaat klopt: voor die naam zelf, of voor een naam van de hoster (uit het certificaat; bij een wildcard
          # afgeleid) die naar hetzelfde IP-adres wijst. Pas daarna worden inloggegevens verstuurd.
          HOST=""
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && { echo "Certificaatcontrole opnieuw over 30 s…"; sleep 30; }
            for base in "$FTP_SERVER" ftp.bingr.online bingr.online; do
              base_ip=$(ip_of "$base"); [ -n "$base_ip" ] || continue
              [ "$attempt" = 1 ] && add_chain "$base"
              if cert_ok "$base"; then HOST="$base"; break 2; fi
              names=$(timeout 40 openssl s_client -connect "$base:21" -starttls ftp -servername "$base" </dev/null 2>/dev/null \
                | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
                | grep -oE '(DNS:|CN ?= ?)(\*\.)?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | sed -E 's/^(DNS:|CN ?= ?)//' | sort -u || true)
              # build 95: ook de naam uit de reverse DNS van het IP-adres (bij gedeelde hosting de echte servernaam,
              # bv. web0123.zxcs.nl, die onder het wildcard-certificaat van de hoster valt)
              ptr=$(getent hosts "$base_ip" 2>/dev/null | awk '{print $2}' | sed 's/\.$//' || true)
              cands="$ptr"; first="${base%%.*}"
              for n in $names; do
                case "$n" in \*.*) cands="$cands $first.${n#\*.} ftp.${n#\*.}";; *) cands="$cands $n";; esac
              done
              [ "$attempt" = 1 ] && echo "::notice::FTPS-certificaat op ${base}: $(echo $names | tr '\n' ' ') · servernaam: ${ptr:-onbekend}"
              for n in $(echo $cands | tr ' ' '\n' | sort -u); do
                n_ip=$(ip_of "$n")
                if [ "$n_ip" != "$base_ip" ]; then [ "$attempt" = 1 ] && echo "::notice::${n}: ander IP-adres dan ${base}, overgeslagen"; continue; fi
                if cert_ok "$n"; then HOST="$n"; break 3; fi
                [ "$attempt" = 1 ] && echo "::notice::${n}: certificaatcontrole: $(vcode "$n")"
              done
            done
          done
          if [ -z "$HOST" ]; then
            echo "::error::Geen FTP-server met een geldig FTPS-certificaat gevonden (FTP_SERVER, ftp.bingr.online, bingr.online). Zet het secret FTP_SERVER op de hostnaam die op het certificaat van de hoster staat."
            exit 1
          fi
          [ "$HOST" != "$FTP_SERVER" ] && echo "::notice::Uploaden via ${HOST} (certificaat gecontroleerd)."
          USER_OK=""
          # de FTP-server reageert soms even niet: tot 4 pogingen met een pauze
          for attempt in 1 2 3 4; do
            [ "$attempt" -gt 1 ] && { echo "Nieuwe poging $attempt over 45 s…"; sleep 45; }
            for u in "$FTP_USERNAME" "${FTP_USERNAME_ALT:-}"; do
              [ -z "$u" ] && continue
              if lftp -e "$common; open --env-password -u \"$u\" \"$HOST\"; cls -1 > /tmp/root.txt; bye" 2>/tmp/err.txt; then
                USER_OK="$u"; break 2
              fi
              # foutmelding zonder regels die gebruikersnaam of wachtwoord kunnen bevatten
              msg=$(grep -viE 'user|pass' /tmp/err.txt | tr '\n' ' ' | tail -c 200 || true)
              echo "::warning::Inloggen mislukt (poging $attempt): ${msg:-geen melding}"
            done
          done
          [ -n "$USER_OK" ] || { echo "::error::Inloggen op de FTP-server mislukt."; exit 1; }
          base="$common"; SERVER_OK="$HOST"
          echo "::notice::Ingelogd via FTPS (certificaat geverifieerd)"

          # doelmap: FTP_DIR, anders de gebruikelijke webmappen, anders de hoofdmap
          TARGET="${FTP_DIR:-}"
          # staat index.html al in de hoofdmap, dan ís de hoofdmap de website (de map web/ is de webspeler, geen webroot)
          if [ -z "$TARGET" ] && grep -qx "/\?index.html" /tmp/root.txt; then TARGET="."; fi
          if [ -z "$TARGET" ]; then
            for d in public_html httpdocs www htdocs domains/bingr.online/public_html; do
              top="${d%%/*}"
              if grep -qx "/\?$top/\?" /tmp/root.txt; then
                if [ "$d" = "$top" ] || lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1 $d/ ; bye" >/dev/null 2>&1; then
                  TARGET="$d"; break
                fi
              fi
            done
          fi
          TARGET="${TARGET:-.}"
          echo "::notice::Doelmap: $([ -n "${FTP_DIR:-}" ] && echo 'FTP_DIR' || echo 'automatisch bepaald')"

          # eenmalige opruiming: builds 62 kwamen per ongeluk in web/ terecht (dan staat er web/web/ en web/changelog/).
          # Alleen in dat geval web/ weghalen; de mirror hieronder zet de echte webspeler er meteen weer neer.
          if [ "$TARGET" = "." ] && lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1 web/web/ ; bye" >/dev/null 2>&1 \
             && lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1 web/changelog/ ; bye" >/dev/null 2>&1; then
            echo "::warning::Verkeerde kopie van de site in web/ gevonden; die wordt opgeruimd en opnieuw geüpload."
            lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; rm -r -f web; bye" || true
          fi
          # het beheer-dashboard staat nu op beheer.bingr.online (privé-repo bingr-beheer): de oude kopie in admindashboard/ weghalen,
          # alleen als die map er nog is (de mirror hieronder verwijdert niets)
          if lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1 \"$TARGET/admindashboard/\" ; bye" >/dev/null 2>&1; then
            lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; rm -r -f \"$TARGET/admindashboard\"; bye" \
              && echo "::notice::Oude map admindashboard/ van de server verwijderd" || echo "::warning::Oude map admindashboard/ kon niet worden verwijderd"
          fi
          # hulpscripts (tools/) horen niet op de site; een eerder meegekomen map weghalen
          if lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1 \"$TARGET/tools/\" ; bye" >/dev/null 2>&1; then
            lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; rm -r -f \"$TARGET/tools\"; bye" >/dev/null 2>&1 \
              && echo "::notice::Map tools/ van de server verwijderd" || echo "::warning::Map tools/ kon niet worden verwijderd"
          fi
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store --exclude ^\\.git/ --exclude ^\\.github/ --exclude ^tools/ --exclude-glob README.md --exclude-glob .gitignore ./ \"$TARGET\"; bye"
          # doorverwijzingen in .htaccess op de server (bestaat er al een van de hoster, dan blijft die inhoud staan):
          # alleen het blok tussen de markeringen wordt (opnieuw) gezet. De hulp van /support.html staat nu op support.bingr.online.
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1 -a \"$TARGET/\"; bye" > /tmp/ls-all.txt 2>/dev/null || true
          rm -f /tmp/htaccess.txt
          ht_ok=1
          if grep -qE '(^|/)\.htaccess$' /tmp/ls-all.txt; then
            lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; get \"$TARGET/.htaccess\" -o /tmp/htaccess.txt; bye" >/dev/null 2>&1 || ht_ok=0
          else
            : > /tmp/htaccess.txt
          fi
          if [ "$ht_ok" = 1 ] && [ -f /tmp/htaccess.txt ]; then
            python3 - <<'PY'
          import re
          p = "/tmp/htaccess.txt"
          s = open(p, encoding="utf-8", errors="surrogateescape").read()
          # feeds van de statuspagina: bingr.online/status/feed(.en).atom|rss -> de functie status (URL uit assets/config.js)
          FN = re.search(r'url:\s*"([^"]+)"', open("assets/config.js").read()).group(1).rstrip("/") + "/functions/v1/status"
          s = re.sub(r"\n?# BEGIN bingr-redirects.*?# END bingr-redirects\n?", "\n", s, flags=re.S).strip("\n")
          s = re.sub(r"\n?# BEGIN bingr-security.*?# END bingr-security\n?", "\n", s, flags=re.S).strip("\n")
          # M5/L15: beveiligingsheaders en http -> https naar hetzelfde pad (eerst, vóór de regels van de hoster).
          # - Het pad komt uit THE_REQUEST (de oorspronkelijke aanvraagregel), niet uit REQUEST_URI of $1: de oude doorverwijzing
          #   van de hoster stuurde http://bingr.online/ naar https://bingr.online/bingr.online/ (intern pad van de map).
          #   NE: het pad staat al gecodeerd in de aanvraag; de querystring gaat automatisch mee.
          # - Alleen voor bingr.online en www (submappen als beheer.bingr.online/ hebben hun eigen RewriteEngine en regels).
          # - frame-ancestors 'none' / X-Frame-Options DENY overal behalve /trailer/: die pagina wordt bewust in een frame
          #   geladen door de Samsung TV-app (doorgeefpagina voor YouTube). De webspeler zet YouTube zelf in een iframe;
          #   dat is frame-src en blijft werken. Alleen frame-ancestors, base-uri en object-src: een volledige CSP met
          #   script-src kan pas als de inline scripts weg zijn.
          # - Referrer-Policy voor de hele site; gevoelige pagina's houden hun eigen <meta name="referrer" content="no-referrer">.
          redirect = ("<IfModule mod_rewrite.c>\n"
                      "RewriteEngine On\n"
                      "RewriteCond %{HTTPS} !=on\n"
                      "RewriteCond %{HTTP:X-Forwarded-Proto} !=https\n"
                      "RewriteCond %{HTTP_HOST} ^(www\\.)?bingr\\.online$ [NC]\n"
                      "RewriteCond %{THE_REQUEST} ^[A-Z]+\\s(/[^\\s?]*)\n"
                      "RewriteRule ^ https://%{HTTP_HOST}%1 [R=301,L,NE]\n"
                      "</IfModule>\n")
          headers = ("<IfModule mod_setenvif.c>\n"
                     "SetEnvIf Request_URI \"/trailer/\" BINGR_FRAME_OK\n"
                     "</IfModule>\n"
                     "<IfModule mod_headers.c>\n"
                     "Header always set Strict-Transport-Security \"max-age=31536000\"\n"
                     "Header always set X-Content-Type-Options \"nosniff\"\n"
                     "Header always set Referrer-Policy \"strict-origin-when-cross-origin\"\n"
                     "Header always set Permissions-Policy \"camera=(), microphone=(), geolocation=()\"\n"
                     "Header always set X-Frame-Options \"DENY\" env=!BINGR_FRAME_OK\n"
                     "Header always set Content-Security-Policy \"frame-ancestors 'none'; base-uri 'self'; object-src 'none'\" env=!BINGR_FRAME_OK\n"
                     "Header always set Content-Security-Policy \"base-uri 'self'; object-src 'none'\" env=BINGR_FRAME_OK\n"
                     "</IfModule>\n"
                     # SEO-audit: compressie (gzip) en cachen van statische bestanden; scripts en stijlen 1 dag (niet alle hebben ?v=)
                     "<IfModule mod_deflate.c>\n"
                     "AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml application/javascript text/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml application/manifest+json\n"
                     "</IfModule>\n"
                     "<IfModule mod_expires.c>\n"
                     "ExpiresActive On\n"
                     "ExpiresByType text/css \"access plus 1 day\"\n"
                     "ExpiresByType application/javascript \"access plus 1 day\"\n"
                     "ExpiresByType text/javascript \"access plus 1 day\"\n"
                     "ExpiresByType image/webp \"access plus 7 days\"\n"
                     "ExpiresByType image/jpeg \"access plus 7 days\"\n"
                     "ExpiresByType image/png \"access plus 7 days\"\n"
                     "ExpiresByType image/svg+xml \"access plus 7 days\"\n"
                     "ExpiresByType font/woff2 \"access plus 1 year\"\n"
                     "ExpiresByType text/html \"access plus 0 seconds\"\n"
                     "</IfModule>\n")
          # Security M3: strikte script-src voor de webspeler (/web/: geen inline scripts; hls.js en mpegts.js staan zelf in
          # web/js/lib) en de accountpagina's (account, koppelen, reset, bevestigen, upgrade): alleen 'self' plus de hashes van
          # hun inline scripts en van de ene inline handler (cookie-instellingen, 'unsafe-hashes'), berekend bij elke deploy.
          # Media, afbeeldingen en verbindingen blijven ruim (IPTV-servers van de gebruiker); het gaat om scripts.
          import base64, hashlib, html as _html
          def _h(t): return "'sha256-" + base64.b64encode(hashlib.sha256(t.encode("utf-8")).digest()).decode() + "'"
          def inline_hashes(path):
              t = open(path, encoding="utf-8").read()
              scr = re.findall(r"<script\b(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script>", t, flags=re.S | re.I)
              hnd = [_html.unescape(v) for v in re.findall(r"\son[a-z]+\s*=\s*\"([^\"]*)\"", t, flags=re.I)]
              hnd += [_html.unescape(v) for v in re.findall(r"\son[a-z]+\s*=\s*'([^']*)'", t, flags=re.I)]
              return sorted({_h(x) for x in scr}), sorted({_h(x) for x in hnd})
          COMMON = ("default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; "
                    "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'")
          csp_lines = ["<IfModule mod_setenvif.c>", "SetEnvIf Request_URI \"^/web/\" BINGR_CSP_WEB"]
          pages = ["account", "koppelen", "reset", "bevestigen", "upgrade"]
          for d in pages: csp_lines.append(f"SetEnvIf Request_URI \"^/{d}(/|$)\" BINGR_CSP_{d.upper()}")
          csp_lines += ["</IfModule>", "<IfModule mod_headers.c>"]
          web_csp = ("script-src 'self'; worker-src 'self' blob:; connect-src * data: blob:; img-src * data: blob:; media-src * data: blob:; "
                     "frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; manifest-src 'self'; " + COMMON)
          csp_lines.append(f"Header always set Content-Security-Policy \"{web_csp}\" env=BINGR_CSP_WEB")
          for d in pages:
              sh, hh = inline_hashes(f"{d}/index.html")
              src = " ".join(["'self'"] + sh + (["'unsafe-hashes'"] + hh if hh else []))
              pol = f"script-src {src}; connect-src 'self' https:; img-src 'self' data: blob: https:; frame-src 'self'; " + COMMON
              csp_lines.append(f"Header always set Content-Security-Policy \"{pol}\" env=BINGR_CSP_{d.upper()}")
          csp_lines.append("</IfModule>")
          headers += "\n".join(csp_lines) + "\n"
          open("/tmp/csp-lines.txt", "w").write("\n".join(csp_lines))
          def security(with_redirect):
              return ("# BEGIN bingr-security (gezet door de workflow Website van bingr-website; niet met de hand wijzigen)\n"
                      + (redirect if with_redirect else "") + headers
                      + "ErrorDocument 404 /404.html\n" + "# END bingr-security\n")
          block = ("# BEGIN bingr-redirects (gezet door de workflow Website van bingr-website; niet met de hand wijzigen)\n"
                   "<IfModule mod_alias.c>\n"
                   "Redirect 301 /support.html https://support.bingr.online/hulp/\n"
                   "RedirectMatch 302 ^/apk/?$ https://beheer.bingr.online/dl.php?app=android\n"
                   "RedirectMatch 302 ^/presskit/?$ https://beheer.bingr.online/dl.php?app=presskit\n"
                   "RedirectMatch 302 ^/windows/?$ https://beheer.bingr.online/dl.php?app=windows\n"
                   "RedirectMatch 302 ^/status/feed\\.atom$ " + FN + "?action=feed&format=atom&lang=nl\n"
                   "RedirectMatch 302 ^/status/feed\\.en\\.atom$ " + FN + "?action=feed&format=atom&lang=en\n"
                   "RedirectMatch 302 ^/status/feed\\.rss$ " + FN + "?action=feed&format=rss&lang=nl\n"
                   "RedirectMatch 302 ^/status/feed\\.en\\.rss$ " + FN + "?action=feed&format=rss&lang=en\n"
                   "</IfModule>\n"
                   "# END bingr-redirects\n")
          rest = ("\n" + s + "\n" if s else "")
          open(p + ".new", "w", encoding="utf-8", errors="surrogateescape").write(security(True) + block + rest)
          # zonder de https-doorverwijzing: terugval als de server achter een proxy zit die HTTPS niet doorgeeft (lus)
          open(p + ".nossl", "w", encoding="utf-8", errors="surrogateescape").write(security(False) + block + rest)
          PY
            if lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; put /tmp/htaccess.txt.new -o \"$TARGET/.htaccess\"; chmod 644 \"$TARGET/.htaccess\"; bye" >/dev/null 2>&1; then
              echo "::notice::.htaccess bijgewerkt (beveiligingsheaders, http → https, /support.html → support.bingr.online/hulp/ en de statusfeeds)"
              # vangnet: stuurt https://bingr.online/ naar zichzelf door (lus), dan de versie zonder https-doorverwijzing
              sleep 3
              loc=$(curl -s -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' https://bingr.online/ || true)
              case "$loc" in
                30[1278]\ https://bingr.online/|30[1278]\ https://www.bingr.online/)
                  lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; put /tmp/htaccess.txt.nossl -o \"$TARGET/.htaccess\"; chmod 644 \"$TARGET/.htaccess\"; bye" >/dev/null 2>&1 || true
                  echo "::warning::https://bingr.online/ stuurde naar zichzelf door (de server ziet https niet); .htaccess zonder http → https-regel gezet. De headers blijven." ;;
              esac
            else
              echo "::warning::.htaccess kon niet worden geüpload; support.html stuurt dan zelf door"
            fi
          else
            echo "::warning::Bestaande .htaccess niet gelezen; niet aangepast (support.html stuurt zelf door)"
          fi
          echo "::notice::Website bijgewerkt op bingr.online"

      - name: Controleren of de site online staat
        if: success()
        run: |
          sleep 5
          bad=0
          # (eerst: GitHub toont maar 10 notices per stap)
          # build 132: deelpreview. titel/index.php rendert de Open Graph-/Twitter-tags server-side (crawlers voeren geen JS uit);
          # gegevens uit de functie title-meta (iptv-ios-appletv). Controle met de user-agents van Facebook/WhatsApp.
          for ua in "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "WhatsApp/2.23.20.0 A"; do
            r=$(curl -s -A "$ua" -o /tmp/og.html --max-time 25 -w '%{http_code}' "https://bingr.online/titel/?type=movie&id=603&q=The%20Matrix&y=1999" || true)
            if grep -q '<?php' /tmp/og.html; then echo "::error::/titel/ geeft de PHP-broncode in plaats van HTML (PHP draait niet)"; bad=1; fi
            tags=$(grep -oE '<meta (property|name)="(og:[a-z_:]+|twitter:[a-z]+)" content="[^"]{0,90}' /tmp/og.html | sed -E 's/<meta (property|name)="//; s/" content="/=/' | tr '\n' ' ')
            echo "::notice::/titel/ voor ${ua%% *} (HTTP $r): ${tags:0:900}"
            for t in 'og:title" content="The Matrix (1999)' 'og:type" content="video.movie' 'og:image" content="https://image.tmdb.org/t/p/w1280/' 'og:image:width" content="1280' 'twitter:card" content="summary_large_image' 'og:site_name" content="Bingr'; do
              grep -qF "$t" /tmp/og.html || { echo "::warning::/titel/ mist voor ${ua%% *}: ${t%%\"*} (terugval op de algemene preview?)"; }
            done
          done
          curl -s --max-time 20 "https://bingr.online/titel/?type=nope" | grep -q 'og:title" content="Bingr' && echo "::notice::/titel/ ongeldige link: algemene Bingr-preview" || echo "::warning::/titel/ ongeldige link gaf geen algemene preview"
          want=$(grep -o '<span data-build>[^<]*' index.html | sed 's/<span data-build>//' | head -1)
          live=$(curl -sL --max-time 20 https://bingr.online/ | grep -o '<span data-build>[^<]*' | sed 's/<span data-build>//' | head -1 || true)
          if [ -n "$want" ] && [ "$live" != "$want" ]; then echo "::error::bingr.online toont '$live', verwacht '$want': de upload is niet op de juiste plek aangekomen."; exit 1; fi
          # security M3: strikte script-src op de webspeler en de accountpagina's, en de zelf gehoste hls.js
          for pth in web/ account/ koppelen/; do
            csp=$(curl -sI --max-time 20 "https://bingr.online/$pth" | tr -d '\r' | grep -i '^content-security-policy:' | head -1)
            case "$csp" in *"script-src 'self'"*) echo "::notice::/$pth: CSP met script-src 'self'" ;; *) echo "::warning::/$pth zonder strikte script-src (CSP: ${csp:0:120})" ;; esac
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://bingr.online/web/js/lib/hls-1.5.17.min.js || true)
          [ "$code" = 200 ] && echo "::notice::hls.js staat zelf op bingr.online" || echo "::warning::web/js/lib/hls-1.5.17.min.js gaf HTTP $code"
          # /support.html is verhuisd naar support.bingr.online (301 via .htaccess, anders de doorverwijspagina)
          r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 https://bingr.online/support.html || true)
          case "$r" in
            30[1278]\ https://support.bingr.online/*) echo "::notice::/support.html stuurt door: $r" ;;
            *) echo "::warning::/support.html geeft '$r' in plaats van een 301 naar support.bingr.online (de doorverwijspagina vangt het op)" ;;
          esac
          # /windows stuurt door naar de openbare Windows-installer in het beheer (zoals /apk)
          r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 https://bingr.online/windows || true)
          case "$r" in
            302\ https://beheer.bingr.online/dl.php\?app=windows) echo "::notice::/windows stuurt door naar dl.php?app=windows" ;;
            *) echo "::warning::/windows gaf '$r' in plaats van een 302 naar beheer.bingr.online/dl.php?app=windows" ;;
          esac
          # statusfeeds: /status/feed.atom en .rss sturen door naar de feed (XML)
          for f in feed.atom feed.en.rss; do
            r=$(curl -sL --max-time 25 -o /tmp/feed.xml -w '%{http_code}' "https://bingr.online/status/$f" || true)
            if [ "$r" = 200 ] && head -c 200 /tmp/feed.xml | grep -q '<?xml'; then echo "::notice::/status/$f geeft de feed (XML)"; else echo "::warning::/status/$f gaf HTTP $r zonder XML"; fi
          done
          # het oude beheer-dashboard mag hier niet meer staan (nu beheer.bingr.online)
          if curl -sL --max-time 20 https://bingr.online/admindashboard/ 2>/dev/null | grep -q 'Beheer · Bingr'; then
            echo "::warning::bingr.online/admindashboard/ toont nog het oude dashboard"
          else
            echo "::notice::bingr.online/admindashboard/ is weg"
          fi
          # M5/L15: beveiligingsheaders live (gezet via het blok bingr-security in .htaccess) en http -> https naar hetzelfde pad
          curl -s -o /dev/null -D /tmp/h.txt --max-time 20 https://bingr.online/koppelen/ || true
          for h in 'strict-transport-security: max-age=31536000' 'x-content-type-options: nosniff' \
                   'referrer-policy: strict-origin-when-cross-origin' 'permissions-policy: camera=(), microphone=(), geolocation=()' \
                   'x-frame-options: deny' "frame-ancestors 'none'" "object-src 'none'" "script-src 'self'"; do
            if tr -d '\r' < /tmp/h.txt | grep -qiF "$h"; then :; else echo "::error::Header ontbreekt op https://bingr.online/koppelen/: $h"; bad=1; fi
          done
          [ "$bad" = 0 ] && echo "::notice::Beveiligingsheaders staan live (HSTS, nosniff, Referrer-Policy, Permissions-Policy, frame-ancestors/X-Frame-Options)"
          # /trailer/ wordt bewust in een frame geladen (Samsung TV-app): daar geen frame-ancestors/X-Frame-Options
          curl -s -o /dev/null -D /tmp/ht.txt --max-time 20 "https://bingr.online/trailer/?v=x" || true
          if tr -d '\r' < /tmp/ht.txt | grep -qiE '^x-frame-options:|frame-ancestors'; then echo "::error::/trailer/ mag niet frame-beperkt zijn (Samsung TV-trailer)"; bad=1
          else echo "::notice::/trailer/ blijft in een frame te laden"; fi
          # pushmeldingen: de service worker van de webspeler (scope /web/) moet als JavaScript komen (nosniff staat aan)
          curl -s -o /dev/null -D /tmp/sw.txt --max-time 20 https://bingr.online/web/sw.js || true
          if tr -d '\r' < /tmp/sw.txt | head -1 | grep -q ' 200' && tr -d '\r' < /tmp/sw.txt | grep -qiE '^content-type: *(application|text)/(x-)?javascript'; then
            echo "::notice::/web/sw.js staat live als JavaScript (service worker voor pushmeldingen)"
          else echo "::error::/web/sw.js gaf geen 200 met Content-Type JavaScript: de service worker voor pushmeldingen kan niet registreren"; bad=1; fi
          # universele links (nieuwsbrief): apple-app-site-association en assetlinks.json als JSON, direct (geen doorverwijzing)
          for f in apple-app-site-association assetlinks.json; do
            r=$(curl -s -o /tmp/wk.json -D /tmp/wk.txt --max-time 20 -w '%{http_code}' "https://bingr.online/.well-known/$f" || true)
            if [ "$r" = 200 ] && tr -d '\r' < /tmp/wk.txt | grep -qiE '^content-type: *application/json' && python3 -c 'import json,sys; json.load(open("/tmp/wk.json"))' 2>/dev/null; then
              echo "::notice::/.well-known/$f staat live als JSON"
            else echo "::error::/.well-known/$f gaf HTTP $r zonder Content-Type application/json of geldige JSON: universele links werken dan niet"; bad=1; fi
          done
          curl -s --max-time 20 https://bingr.online/.well-known/apple-app-site-association | grep -q 'EU3UY476T6.nl.lrvdlinden.bingr' \
            || { echo "::error::apple-app-site-association bevat het appID van Bingr niet"; bad=1; }
          curl -s --max-time 20 https://bingr.online/.well-known/assetlinks.json | grep -q 'nl.lrvdlinden.bingr' \
            || { echo "::error::assetlinks.json bevat het package van Bingr niet"; bad=1; }
          r=$(curl -s -o /tmp/titel.html --max-time 20 -w '%{http_code}' "https://bingr.online/titel/?type=movie&id=603&q=Test&y=1999" || true)
          if [ "$r" = 200 ] && grep -q 'noindex' /tmp/titel.html; then echo "::notice::/titel/ staat live (noindex)"; else echo "::error::/titel/ gaf HTTP $r"; bad=1; fi
          for path in "/" "/koppelen/?code=TEST12" "/web/"; do
            r=$(curl -s -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "http://bingr.online$path" || true)
            if [ "$r" = "301 https://bingr.online$path" ]; then echo "::notice::http://bingr.online$path stuurt door naar https (zelfde pad)"
            else echo "::error::http://bingr.online$path gaf '$r', verwacht '301 https://bingr.online$path'"; bad=1; fi
          done
          for url in https://bingr.online/ http://bingr.online/ https://www.bingr.online/; do
            code=$(curl -sL --max-time 20 -o /tmp/site.html -w '%{http_code}' "$url" || true)
            if grep -q 'data-build' /tmp/site.html 2>/dev/null; then
              echo "::notice::$url is live (HTTP $code), versie $(grep -o '<span data-build>[^<]*' /tmp/site.html | sed 's/<span data-build>//' | head -1)"
            else
              echo "::warning::$url geeft HTTP $code, nog niet de Bingr-site: $(head -c 160 /tmp/site.html 2>/dev/null | tr '\n' ' ')"
            fi
          done
          [ "$bad" = 0 ] || exit 1
