<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afmelden · Bingr</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../assets/js/account.css">
</head>
<body>
<header><a class="logo" href="../index.html">BINGR</a><a id="langSwitch" class="lang" href="#">English</a></header>
<main><div class="card">
  <section id="ask" class="hidden">
    <h1 data-t="title"></h1>
    <p data-t="ask"></p>
    <div id="err" class="err"></div>
    <button id="go" class="btn" type="button" data-t="button"></button>
  </section>
  <section id="done" class="done hidden"><div class="big">✓</div><h1 data-t="doneTitle"></h1><p data-t="doneText"></p></section>
  <section id="invalid" class="done hidden"><div class="big">⚠︎</div><h1 data-t="badTitle"></h1><p data-t="badText"></p></section>
</div></main>
<footer>© 2026 Bingr · <a href="../privacy.html">Privacy</a> · <a href="../support.html">Support</a></footer>
<script src="../assets/config.js"></script>
<script>
(() => {
  const T = {
    nl: { title: "Afmelden voor berichten", ask: "Wil je geen berichten van Bingr meer per e-mail ontvangen? Mails over je account (bevestigen, wachtwoord) blijven gewoon komen.",
          button: "Afmelden", doneTitle: "Je bent afgemeld", doneText: "Je krijgt geen berichten van Bingr meer per e-mail. Berichten in de app zie je nog wel.",
          badTitle: "Link ongeldig", badText: "Deze afmeldlink klopt niet. Gebruik de link uit de laatste e-mail, of neem contact op via Support.",
          err: "Er ging iets mis. Probeer het opnieuw.", other: "English" },
    en: { title: "Unsubscribe from announcements", ask: "Don't want to receive Bingr announcements by email anymore? Account emails (confirmation, password) will still be sent.",
          button: "Unsubscribe", doneTitle: "You're unsubscribed", doneText: "You won't receive Bingr announcements by email anymore. You'll still see announcements in the app.",
          badTitle: "Invalid link", badText: "This unsubscribe link isn't valid. Use the link from the latest email, or contact Support.",
          err: "Something went wrong. Please try again.", other: "Nederlands" },
  };
  let lang = (navigator.language || "nl").toLowerCase().startsWith("nl") ? "nl" : "en";
  const $ = (id) => document.getElementById(id);
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[lang][el.dataset.t]));
    $("langSwitch").textContent = T[lang].other;
    document.title = `${T[lang].title} · Bingr`;
  }
  $("langSwitch").onclick = (e) => { e.preventDefault(); lang = lang === "nl" ? "en" : "nl"; render(); };
  const show = (id) => ["ask", "done", "invalid"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
  const t = new URLSearchParams(location.search).get("t") || "";
  render();
  if (!/^[0-9a-f-]{36}\.[A-Za-z0-9_-]{10,}$/i.test(t)) { show("invalid"); return; }
  show("ask");
  $("go").onclick = async () => {
    const cfg = window.BINGR_SUPABASE || {};
    $("go").disabled = true; $("err").textContent = "";
    try {
      const r = await fetch(`${cfg.url}/functions/v1/admin`, { method: "POST", headers: { "Content-Type": "application/json", apikey: cfg.anonKey || "" },
        body: JSON.stringify({ action: "unsubscribe", t }) });
      const b = await r.json().catch(() => ({}));
      if (r.ok && b.ok) show("done"); else if (b.error === "invalid_token") show("invalid"); else $("err").textContent = T[lang].err;
    } catch { $("err").textContent = T[lang].err; }
    finally { $("go").disabled = false; }
  };
})();
</script>
</body>
</html>
