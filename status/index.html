<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<body>
<header class="top">

    <a class="brand" href="../index.html"><span class="logo">BINGR</span><span class="tag">Status</span></a>

<main class="wrap">
  <section id="banner" class="banner loading" aria-live="polite">

      <h1 id="bannerTitle" data-t="loading"></h1>
      <p id="bannerSub" class="muted"></p>

  <div id="groups"></div>

  <section class="incidents">
    <h2 data-t="incidents"></h2>
    <div id="incidents"></div>
  </section>

  <div id="error" class="err hidden" role="alert"></div>
</main>

<div id="tip" class="tip hidden" role="tooltip"></div>
