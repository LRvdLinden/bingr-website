<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn Bingr</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../assets/js/account.css">
<style>
.me{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.me .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:30px;background:linear-gradient(135deg,#E50914,#7A0008);flex:none;overflow:hidden}
h2{font-size:20px;font-weight:800;margin:34px 0 4px}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px;margin-top:16px}
.pf{text-align:center}
.pf .pic{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:38px}
.pf .pic img{width:100%;height:100%;object-fit:cover}
.pf .n{font-size:14px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf .k{font-size:11px;color:var(--sec)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .btn{width:auto;margin-top:0;padding:12px 18px;font-size:15px}
.dev .ic{color:#fff}
.dev .rm+.rm{margin-left:6px}
@media (max-width:520px){.dev{flex-wrap:wrap}.dev .info{flex-basis:calc(100% - 60px)}.dev .rm{margin-left:58px}.dev .rm+.rm{margin-left:6px}}
.live{background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:4px;padding:2px 7px;flex:none}
.history .day{font-size:15px;color:#fff;margin:18px 0 4px;text-transform:capitalize}
.hrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #ffffff10}.hrow .ht{color:var(--sec);font-size:14px;width:48px;flex:none;padding-top:2px}
.form{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:10px;padding:18px;margin-top:14px}.form h3{font-size:16px;margin-bottom:6px}
.form label{display:block;margin-top:12px;font-size:13px;color:var(--sec)}.form label input,.form select{margin-top:6px}
.form select{width:100%;font:inherit;font-size:16px;color:#fff;background:#333;border:1px solid transparent;border-radius:6px;padding:14px}
.form .chk{display:flex;align-items:center;gap:8px;color:#ddd;font-size:15px}.form .chk input{width:auto;margin:0}.chks{display:flex;gap:18px;flex-wrap:wrap}
.btn.danger{background:none;border:1px solid #ff4d4d66;color:#ff8080}
</style>
<script src="../assets/js/consent.js" data-base="../"></script>
</head>
<body>
<header><a class="logo" href="../index.html">BINGR</a><a id="langSwitch" class="lang" href="#">English</a></header>
<main><div class="card wide">
  <section id="auth" class="hidden">
    <h1 data-t="title"></h1>
    <p class="muted" data-t="intro"></p>
    <form id="authForm" novalidate>
      <label><input id="email" type="email" autocomplete="email" data-ph="email"></label>
      <label class="pw"><input id="password" type="password" autocomplete="current-password" data-ph="password"><button type="button"></button></label>
      <div id="authErr" class="err"></div>
      <button id="authBtn" class="btn" type="submit" data-t="signIn"></button>
    </form>
    <div class="links"><a id="forgot" data-t="forgot"></a><div style="margin-top:14px"><span data-t="newTo"></span> <a href="../tv/?mode=signup" data-t="signUpNow"></a></div></div>
  </section>

  <section id="acc" class="hidden">
    <div class="me"><div class="av" id="ini"></div><div><h1 style="margin:0" data-t="title"></h1><div class="muted" id="who"></div></div></div>

    <h2 data-t="profiles"></h2>
    <p class="muted" data-t="profHelp"></p>
    <div class="profiles" id="profiles"></div>

    <h2 data-t="devices"></h2>
    <p class="muted"><span id="count"></span> · <span data-t="devHelp"></span></p>
    <div id="list" style="margin-top:8px"></div>
    <div class="row"><a class="btn ghost" href="../tv/" data-t="linkTv"></a></div>

    <h2 data-t="watching"></h2>
    <p class="muted" id="streamCount"></p>
    <div id="streams" style="margin-top:8px"></div>

    <h2 data-t="historyTitle"></h2>
    <div id="history" class="history"></div>

    <h2 data-t="servers"></h2>
    <p class="muted" data-t="serversHelp"></p>
    <div id="sources" style="margin-top:8px"></div>
    <div class="row"><button class="btn ghost" id="addSource" data-t="addServer"></button></div>
    <div id="srcForm" class="form hidden"></div>
    <div id="srcMsg" class="err"></div>

    <h2 data-t="collectionsTitle"></h2>
    <p class="muted" data-t="collectionsHelp"></p>
    <div id="collections" style="margin-top:8px"></div>
    <div class="form">
      <h3 data-t="newSmart"></h3>
      <label><span data-t="name"></span><input id="colName" data-ph="colNamePh"></label>
      <label><span data-t="keywords"></span><input id="colQuery" data-ph="colQueryPh"></label>
      <div class="chks"><label class="chk"><input type="checkbox" id="colT_channel" checked> <span data-t="tChannels"></span></label><label class="chk"><input type="checkbox" id="colT_movie" checked> <span data-t="tMovies"></span></label><label class="chk"><input type="checkbox" id="colT_series" checked> <span data-t="tSeries"></span></label></div>
      <div class="row"><button class="btn" id="colAdd" data-t="create"></button></div>
      <div id="colMsg" class="err"></div>
    </div>

    <h2 data-t="account"></h2>
    <div class="row">
      <button class="btn ghost" id="resetPw" data-t="changePw"></button>
      <button class="btn ghost" id="signOut" data-t="signOut"></button>
      <button class="btn danger" id="delete" data-t="delete"></button>
    </div>
    <div id="accErr" class="err"></div>
  </section>
  <section id="loading" class="done"><p class="muted" data-t="waiting"></p></section>
</div></main>
<footer>© 2026 Bingr · <a href="../changelog/">Changelog</a> · <a href="../privacy.html">Privacy</a> · <a href="../support.html">Support</a> · <a href="#" onclick="BingrConsent.open();return false">Cookies</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/js/account.js"></script>
<script src="../assets/js/userbtn.js" data-base="../"></script>
<script src="../assets/js/console.js"></script>
<script>
const { sb, $, t, pwToggles, busy, cfg, lang } = Bingr;
const tr = t({
  nl: { watching:"Nu aan het kijken", watchingCount:"%d van %d schermen kijken nu", watchingFor:"kijkt al %s", signedInSince:"ingelogd sinds %s", nobodyWatching:"Er kijkt nu niemand.",
        historyTitle:"Kijkgeschiedenis (7 dagen)", noHistory:"Nog niets bekeken in de afgelopen 7 dagen.", today:"Vandaag", minutes:"%d min", hours:"%d u %m min",
        servers:"Servers en afspeellijsten", serversHelp:"Wijzigingen staan binnen een paar minuten op al je apparaten. Plex, Jellyfin, Emby en Stremio voeg je toe in de app.", addServer:"Server toevoegen", editServer:"Server wijzigen",
        type:"Type", name:"Naam", m3uUrl:"M3U-URL", epgUrl:"EPG-URL (XMLTV)", optional:"optioneel", server:"Server", username:"Gebruikersnaam", unchanged:"ongewijzigd", hls:"Live als HLS (.m3u8)",
        portal:"Portal-URL", mac:"MAC-adres", makeMain:"Hoofdserver", save:"Opslaan", cancel:"Annuleren", deleteServer:"Server verwijderen", deleteServerConfirm:"%s verwijderen van al je apparaten?",
        appOnly:"Deze server beheer je in de app (er is een login nodig).", mainSrv:"Hoofdserver", edit:"Wijzigen", noSources:"Nog geen servers.", nameMissing:"Vul een naam in.", urlMissing:"Vul een geldige URL in.",
        fieldsMissing:"Vul alle velden in.", savedSync:"Opgeslagen — verschijnt binnen een paar minuten op je apparaten.",
        collectionsTitle:"Collecties", collectionsHelp:"Eigen rijen op het startscherm. Losse titels voeg je toe in de app; slimme collecties vullen zichzelf op zoekwoord.", newSmart:"Nieuwe slimme collectie",
        keywords:"Zoekwoorden", colNamePh:"Bijv. Mijn sport", colQueryPh:"Bijv. sport, voetbal, F1", tChannels:"Zenders", tMovies:"Films", tSeries:"Series", create:"Maken",
        smart:"Slim", manual:"%d titels", noCollections:"Nog geen collecties.", deleteCollection:"Collectie %s verwijderen?", title:"Mijn Bingr", intro:"Log in om je profielen, apparaten en account te bekijken.", signIn:"Inloggen", email:"E-mailadres", password:"Wachtwoord", show:"Tonen", hide:"Verbergen",
        forgot:"Wachtwoord vergeten?", newTo:"Nieuw bij Bingr?", signUpNow:"Maak nu een account.",
        profiles:"Profielen", profHelp:"Profielen beheer je in de app; ze staan op al je apparaten.", kids:"Kinderprofiel", main:"Hoofdaccount", noProfiles:"Nog geen profielen. Open Bingr op een apparaat om te beginnen.",
        devices:"Apparaten", count:"%d van %d apparaten", devHelp:"Maximaal 15 apparaten. Verwijder je een apparaat, dan wordt het automatisch uitgelogd.", linkTv:"Tv koppelen",
        linked:"Gekoppeld", lastUsed:"laatst gebruikt", remove:"Verwijderen", rename:"Naam wijzigen", devName:"Naam van het apparaat", confirm:"%s verwijderen? Het apparaat wordt uitgelogd.", none:"Nog geen apparaten gekoppeld.",
        account:"Account", changePw:"Wachtwoord wijzigen", signOut:"Uitloggen", delete:"Account verwijderen",
        delConfirm:"Je Bingr-account verwijderen? Al je apparaten worden uitgelogd en je profielen op de server worden gewist. Dit kan niet ongedaan worden gemaakt.",
        resetSent:"We hebben je een e-mail gestuurd om je wachtwoord te wijzigen.", justNow:"zojuist", minAgo:"%d min geleden", yesterday:"gisteren", waiting:"Even geduld…",
        badCreds:"Onjuist e-mailadres of wachtwoord.", notConfirmed:"Bevestig eerst je e-mailadres. Kijk in je inbox.", generic:"Er ging iets mis. Probeer het opnieuw.", badEmail:"Vul een geldig e-mailadres in.",
        resetSent2:"Bestaat er een account met dit adres, dan ontvang je een e-mail om je wachtwoord opnieuw in te stellen." },
  en: { watching:"Watching now", watchingCount:"%d of %d screens watching now", watchingFor:"watching for %s", signedInSince:"signed in since %s", nobodyWatching:"Nobody is watching right now.",
        historyTitle:"Watch history (7 days)", noHistory:"Nothing watched in the last 7 days.", today:"Today", minutes:"%d min", hours:"%d h %m min",
        servers:"Servers and playlists", serversHelp:"Changes reach all your devices within a few minutes. Add Plex, Jellyfin, Emby and Stremio in the app.", addServer:"Add server", editServer:"Edit server",
        type:"Type", name:"Name", m3uUrl:"M3U URL", epgUrl:"EPG URL (XMLTV)", optional:"optional", server:"Server", username:"Username", unchanged:"unchanged", hls:"Live as HLS (.m3u8)",
        portal:"Portal URL", mac:"MAC address", makeMain:"Main server", save:"Save", cancel:"Cancel", deleteServer:"Delete server", deleteServerConfirm:"Delete %s from all your devices?",
        appOnly:"Manage this server in the app (it needs a sign-in).", mainSrv:"Main server", edit:"Edit", noSources:"No servers yet.", nameMissing:"Enter a name.", urlMissing:"Enter a valid URL.",
        fieldsMissing:"Fill in all fields.", savedSync:"Saved — shows up on your devices within a few minutes.",
        collectionsTitle:"Collections", collectionsHelp:"Your own rows on the home screen. Add individual titles in the app; smart collections fill themselves by keyword.", newSmart:"New smart collection",
        keywords:"Keywords", colNamePh:"E.g. My sports", colQueryPh:"E.g. sports, football, F1", tChannels:"Channels", tMovies:"Movies", tSeries:"Series", create:"Create",
        smart:"Smart", manual:"%d titles", noCollections:"No collections yet.", deleteCollection:"Delete collection %s?", title:"My Bingr", intro:"Sign in to see your profiles, devices and account.", signIn:"Sign In", email:"Email", password:"Password", show:"Show", hide:"Hide",
        forgot:"Forgot password?", newTo:"New to Bingr?", signUpNow:"Sign up now.",
        profiles:"Profiles", profHelp:"You manage profiles in the app; they're on all your devices.", kids:"Kids profile", main:"Main account", noProfiles:"No profiles yet. Open Bingr on a device to get started.",
        devices:"Devices", count:"%d of %d devices", devHelp:"Up to 15 devices. Removing a device signs it out automatically.", linkTv:"Link a TV",
        linked:"Linked", lastUsed:"last used", remove:"Remove", rename:"Rename", devName:"Device name", confirm:"Remove %s? It will be signed out.", none:"No devices linked yet.",
        account:"Account", changePw:"Change password", signOut:"Sign out", delete:"Delete account",
        delConfirm:"Delete your Bingr account? All your devices will be signed out and your profiles on the server will be erased. This can't be undone.",
        resetSent:"We've sent you an email to change your password.", justNow:"just now", minAgo:"%d min ago", yesterday:"yesterday", waiting:"One moment…",
        badCreds:"Incorrect email or password.", notConfirmed:"Confirm your email address first. Check your inbox.", generic:"Something went wrong. Please try again.", badEmail:"Enter a valid email address.",
        resetSent2:"If an account exists, you'll receive an email to reset your password." }
});
pwToggles(tr);
const loc = lang === "nl" ? "nl-NL" : "en-GB";
// apparaat-iconen (zelfde stijl als de apps)
const SV = (d) => `<svg viewBox="0 0 48 48" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const PHONE = SV('<rect x="14" y="4" width="20" height="40" rx="5"/><path d="M21 8h6"/>');
const icons = {
  "iPhone": PHONE,
  "iPad": SV('<rect x="8" y="5" width="32" height="38" rx="4"/><circle cx="24" cy="39" r="1.2" fill="currentColor"/>'),
  "Mac": SV('<rect x="8" y="9" width="32" height="22" rx="2.5"/><path d="M3 37h42l-3-6H6z"/>'),
  "Apple TV": SV('<rect x="7" y="17" width="34" height="14" rx="4"/><path d="M14 36h20"/>'),
  "Android": SV('<rect x="14" y="4" width="20" height="40" rx="5"/><circle cx="24" cy="9" r="1.3" fill="currentColor"/>'),
  "Android tablet": SV('<rect x="4" y="9" width="40" height="30" rx="4"/><circle cx="24" cy="13" r="1.2" fill="currentColor"/>'),
  "Android TV": SV('<rect x="4" y="8" width="40" height="26" rx="3"/><path d="M17 41h14M24 34v7"/>'),
  "Google TV": SV('<rect x="4" y="8" width="40" height="26" rx="3"/><path d="M17 41h14M24 34v7"/><circle cx="24" cy="21" r="5"/>'),
  "Fire TV": SV('<rect x="6" y="20" width="26" height="9" rx="3"/><path d="M32 22.5h5a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-5"/><path d="M12 24.5h8"/>'),
};
// zelfde iconen en kleuren als de apps (iOS-symboolnaam → emoji, kleurindex → verloop)
const SYM = { tv:"📺", globe:"🌐", sportscourt:"⚽", crown:"👑", flame:"🔥", film:"🎬", popcorn:"🍿", star:"⭐", gamecontroller:"🎮", "moon.stars":"🌙", bolt:"⚡", heart:"❤️",
  "waveform.path.ecg":"🎧", hare:"🐰", forward:"🚀", sparkle:"🌈", link:"🔗", "bubble.left":"💬", wifi:"📶", umbrella:"☂️", play:"▶️", "book.closed":"📕", person:"🧸", paintbrush:"🎭" };
const PAL = [["#E50914","#7A0008"],["#2563EB","#1E1B4B"],["#10B981","#064E3B"],["#F59E0B","#9A3412"],["#A855F7","#3B0764"],["#EC4899","#831843"],["#14B8A6","#0C4A6E"],["#64748B","#0F172A"]];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function show(id) { ["auth", "acc", "loading"].forEach((s) => $(s).classList.toggle("hidden", s !== id)); }
function rel(iso) {
  const d = new Date(iso), m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return tr("justNow"); if (m < 60) return tr("minAgo").replace("%d", m);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (d >= today) return d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
  if (d >= new Date(today - 864e5)) return tr("yesterday");
  return d.toLocaleDateString(loc, { day: "numeric", month: "short", year: "numeric" });
}
async function call(action, extra) {
  const { data } = await sb.auth.getSession();
  if (!data.session) throw new Error("signed_out");
  const r = await fetch(cfg.url + "/functions/v1/device-auth", { method: "POST",
    headers: { "Content-Type": "application/json", apikey: cfg.anonKey, Authorization: "Bearer " + data.session.access_token },
    body: JSON.stringify(Object.assign({ action }, extra || {})) });
  if (r.status === 401) { await sb.auth.signOut(); throw new Error("signed_out"); }
  const j = await r.json(); if (!r.ok) throw new Error(j.error || "x"); return j;
}
async function loadProfiles() {
  const { data } = await sb.from("account_data").select("profiles").maybeSingle();
  const list = ((data && data.profiles) || []).filter((p) => p && !p.deleted).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (!list.length) { $("profiles").innerHTML = `<p class="muted" style="grid-column:1/-1">${tr("noProfiles")}</p>`; return; }
  $("profiles").innerHTML = list.map((p, i) => {
    const av = p.avatar || {}, sym = av.symbol || "tv", pal = PAL[((av.colorIndex || 0) % PAL.length + PAL.length) % PAL.length];
    const inner = sym.startsWith("kid") ? `<img src="../assets/img/${esc(sym)}.png" alt="">` : (av.emoji && !/^[a-z.]+$/.test(av.emoji) ? esc(av.emoji) : (SYM[sym] || "📺"));
    return `<div class="pf"><div class="pic" id="pic${i}" style="background:linear-gradient(135deg,${pal[0]},${pal[1]})">${inner}</div>
      <div class="n">${esc(p.name)}</div><div class="k">${p.isMain ? tr("main") : p.kids ? tr("kids") : "&nbsp;"}</div></div>`;
  }).join("");
  list.forEach(async (p, i) => {
    if (!p.photo || !p.photo.path) return;
    const { data: blob } = await sb.storage.from("avatars").download(p.photo.path);
    if (blob) $("pic" + i).innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="">`;
  });
}
async function loadDevices() {
  const j = await call("list_devices");
  $("count").textContent = tr("count").replace("%d", j.devices.length).replace("%d", j.limit);
  $("list").innerHTML = j.devices.length ? j.devices.map((d) => `
    <div class="dev"><div class="ic">${icons[d.platform] || icons["Android TV"]}</div>
      <div class="info"><div class="nm">${esc(d.name || d.platform)}</div>
        <div class="meta">${esc(d.platform)} · ${tr("linked")} ${new Date(d.created_at).toLocaleDateString(loc, { day: "numeric", month: "short", year: "numeric" })} · ${tr("lastUsed")} ${rel(d.last_seen_at)}</div></div>
      <button class="rm rn" data-id="${esc(d.device_id)}" data-name="${esc(d.name || d.platform)}">${tr("rename")}</button>
      <button class="rm del" data-id="${esc(d.device_id)}" data-name="${esc(d.name || d.platform)}">${tr("remove")}</button></div>`).join("")
    : `<p class="muted">${tr("none")}</p>`;
  document.querySelectorAll(".rn").forEach((b) => b.onclick = async () => {
    const name = prompt(tr("devName"), b.dataset.name);
    if (name == null || !name.trim()) return;
    b.disabled = true;
    try { await call("rename_device", { device_id: b.dataset.id, name: name.trim().slice(0, 60) }); loadDevices(); } catch (e) { $("accErr").textContent = tr("generic"); b.disabled = false; }
  });
  document.querySelectorAll(".del").forEach((b) => b.onclick = async () => {
    if (!confirm(tr("confirm").replace("%s", b.dataset.name))) return;
    b.disabled = true;
    try { await call("remove_device", { device_id: b.dataset.id }); loadDevices(); } catch (e) { $("accErr").textContent = tr("generic"); b.disabled = false; }
  });
}
async function load() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return show("auth");
  const email = data.session.user.email || "";
  $("who").textContent = email; BingrAvatar.paint($("ini"), email); show("acc"); $("accErr").textContent = "";
  BingrAvatar.refresh(data.session, () => BingrAvatar.paint($("ini"), email));
  try { await Promise.all([loadProfiles(), loadDevices()]); BingrConsole.loadAll(); }
  catch (e) { if (e.message === "signed_out") show("auth"); else $("accErr").textContent = tr("generic"); }
}
$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  busy($("authBtn"), true, tr("waiting")); $("authErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  busy($("authBtn"), false, tr("signIn"));
  if (error) { $("authErr").textContent = error.code === "email_not_confirmed" ? tr("notConfirmed") : error.code === "invalid_credentials" ? tr("badCreds") : tr("generic"); return; }
  load();
};
$("forgot").onclick = async () => {
  const email = $("email").value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $("authErr").textContent = tr("badEmail"); return; }
  await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/reset/" });
  $("authErr").innerHTML = '<span class="ok">' + tr("resetSent2") + "</span>";
};
$("resetPw").onclick = async () => {
  const { data } = await sb.auth.getSession(); if (!data.session) return;
  await sb.auth.resetPasswordForEmail(data.session.user.email, { redirectTo: location.origin + "/reset/" });
  $("accErr").innerHTML = '<span class="ok">' + tr("resetSent") + "</span>";
};
$("signOut").onclick = async () => { await sb.auth.signOut(); BingrAvatar.clear(); show("auth"); };
$("delete").onclick = async () => {
  if (!confirm(tr("delConfirm"))) return;
  try { await call("delete_account"); await sb.auth.signOut(); BingrAvatar.clear(); show("auth"); } catch (e) { $("accErr").textContent = tr("generic"); }
};
load();
</script>
</body>
</html>
